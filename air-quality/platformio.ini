; PlatformIO Project Configuration File
;
; Air quality node: PMS5003 digital particulate sensor (PM1.0/PM2.5/PM10)
; on a classic ESP32 (WROOM-32 style dev board), serving readings as JSON
; for the main weather station (../platformio.ini) to poll over the LAN,
; the same way it polls the AHT20+BMP280 node (../local-sensor).
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; huge_app.csv (single ~3MB app partition, no OTA slot) matches the scheme
; the main station (../platformio.ini) uses on its own ESP32 -- comfortably
; fits WiFi + WebServer + mDNS + ArduinoJson + this sensor library on a
; 4MB flash board without getting close to the default scheme's smaller
; app partition.
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit PM25 AQI Sensor@^2.0.0
    bblanchon/ArduinoJson@^7.1.0
