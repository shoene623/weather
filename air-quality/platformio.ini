; PlatformIO Project Configuration File
;
; Air quality node: PMS5003 digital particulate sensor (PM1.0/PM2.5/PM10)
; on an ESP32-C3 SuperMini, serving readings as JSON
; for the main weather station (../platformio.ini) to poll over the LAN,
; the same way it polls the AHT20+BMP280 node (../local-sensor).
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
; The SuperMini has no dedicated PlatformIO board definition; the DevKitM-1
; matches its chip (ESP32-C3, 4MB flash) and is the usual stand-in.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The SuperMini has no USB-UART bridge chip -- its USB-C port goes straight
; to the C3's built-in USB-Serial/JTAG. These flags route Serial over that
; port so the monitor works; without them Serial goes to UART0 (GPIO20/21)
; and nothing shows up over USB.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; huge_app.csv (single ~3MB app partition, no OTA slot) matches the scheme
; the main station (../platformio.ini) uses on its own ESP32 -- comfortably
; fits WiFi + WebServer + mDNS + ArduinoJson + this sensor library on the
; SuperMini's 4MB flash without getting close to the default scheme's smaller
; app partition.
board_build.partitions = huge_app.csv
lib_deps =
    adafruit/Adafruit PM25 AQI Sensor@^2.0.0
    bblanchon/ArduinoJson@^7.1.0
