; PlatformIO Project Configuration File
;
; Local sensor node: AHT20+BMP280 combo module (temperature, humidity,
; pressure) on an ESP32-S3, serving readings as JSON for the main weather
; station (../platformio.ini) to poll over the LAN.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; This is an ESP32-S3-DevKitC-1 N16R8 module: 16MB flash + 8MB *octal* PSRAM
; (the "R8" on N16R8 means octal-SPI PSRAM, not the quad PSRAM most S3 boards
; use). qio_opi = quad I/O flash + octal I/O PSRAM, which matches this chip;
; getting this wrong can hang PSRAM init at boot even though we don't use
; PSRAM directly here.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
lib_deps =
    adafruit/Adafruit AHTX0@^2.0.5
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.1.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
